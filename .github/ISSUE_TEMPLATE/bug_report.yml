name: Informe de error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **No adjuntes tu partida de Steam ni tu `user.db`.** Para fallos de seguridad no uses este formulario: lee SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Versión de la aplicación
      description: La ves en «Acerca de».
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: dropdown
    id: instalacion
    attributes:
      label: Tipo de instalación
      options:
        - Instalador
        - Zip portable
        - Desde el código fuente
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abro...
        2. Pulso...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Registro (opcional)
      description: |
        Contenido de `%LOCALAPPDATA%\GuiaMHW\logs\guiamhw.log` (en la versión portable, `GuiaMHW\data\logs\guiamhw.log`).
        **Revísalo antes de pegarlo** y borra cualquier dato personal (rutas con tu nombre de usuario, etc.).
        NUNCA adjuntes tu partida ni `user.db`.
      render: text
