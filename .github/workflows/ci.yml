name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            etl/requirements.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt -r etl/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('etl/mhw_etl/config.py') }}
      - name: Generar el catálogo
        working-directory: etl
        run: python -m mhw_etl all --out ../build/catalog.db
      - run: pytest tests -q

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            etl/requirements.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt -r etl/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-win-${{ hashFiles('etl/mhw_etl/config.py') }}
      - name: Generar el catálogo
        shell: pwsh
        working-directory: etl
        run: python -m mhw_etl all --out ../build/catalog.db
      - run: pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
